site_name: MNELAB Streams
site_url: https://nitzanlux.github.io/mnelab-streams/
repo_name: NitzanLux/mnelab-streams
repo_url: https://github.com/NitzanLux/mnelab-streams
copyright: © MNELAB developers and MNELAB Streams contributors
nav:
  - Home: index.md
  - Quick Start: quickstart/index.md
  - Releases: releases.md
  - Software Specification: software-specification.md
  - Documentation:
    - documentation/index.md
    - Settings: documentation/settings.md
    - Renaming Channels: documentation/rename_channels.md
    - ERDS Maps: documentation/erds_maps.md
    - ERPs: documentation/erp.md
theme:
  name: material
  favicon: favicon.png
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Use system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to light theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to dark theme
  features:
    - navigation.indexes
    - toc.integrate
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
