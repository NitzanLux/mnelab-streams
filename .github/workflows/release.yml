name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  build_standalone:
    name: Build standalone executables
    needs: test
    uses: ./.github/workflows/standalone.yml

  release:
    name: Create GitHub release
    needs: build_standalone
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Build release notes from the changelog
        run: python3 tools/changelog.py notes "${GITHUB_REF_NAME#v}" -o release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MNELAB Streams ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            artifacts/*/*

  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        run: |
          uv build
          uv publish
