name: Standalone

on:
  workflow_dispatch:
  workflow_call:

jobs:
  standalone-macos:
    name: Build macOS standalone (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15  # Apple Silicon runner
            arch: arm64
          # macos-13 was the last Intel image before it was retired; if this label
          # ever disappears too, drop the entry and ship Apple Silicon only
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Install the project
        run: uv sync --locked --all-extras
      - name: Build app bundle
        working-directory: standalone
        run: uv run python create-standalone-macos.py build-app
      # Configure signing with the fork maintainer's own Apple credentials before
      # distributing a notarized macOS release.
      - name: Create unsigned DMG
        working-directory: standalone
        run: uv run python create-standalone-macos.py build-dmg
      - name: Verify the DMG matches the runner architecture
        working-directory: standalone
        run: test -f MNELAB-Streams-*-${{ matrix.arch }}.dmg
      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: mnelab-streams-macos-${{ matrix.arch }}-installer
          path: standalone/MNELAB-Streams-*-${{ matrix.arch }}.dmg

  standalone-windows:
    name: Build Windows standalone
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Install the project
        run: uv sync --locked --all-extras
      - uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install innosetup
      - name: Build standalone installer
        working-directory: standalone
        shell: pwsh
        run: |
          . ..\.venv\Scripts\Activate.ps1
          .\create-standalone-windows.ps1
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: mnelab-streams-windows-installer
          path: standalone/MNELAB-Streams-*.exe

  standalone-linux:
    name: Build Linux standalone
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Install Linux packages
        run: |
          sudo apt update
          sudo apt install libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
                           libxkbcommon-x11-0 libxcb-randr0 \
                           libxcb-render-util0 libxcb-xinerama0 libegl1 \
                           libxcb-shape0 libxcb-cursor0
      - name: Install the project
        run: uv sync --locked --all-extras
      - name: Build portable application
        working-directory: standalone
        run: |
          source ../.venv/bin/activate
          ./create-standalone-linux.sh
      - name: Upload Linux archive
        uses: actions/upload-artifact@v7
        with:
          name: mnelab-streams-linux-archive
          path: standalone/MNELAB-Streams-*-linux-*.tar.gz
