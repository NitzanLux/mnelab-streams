name: Standalone

on:
  workflow_dispatch:
  workflow_call:

jobs:
  standalone-macos:
    name: Build macOS standalone
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Install the project
        run: uv sync --locked --all-extras
      - name: Build app bundle
        working-directory: standalone
        run: uv run python create-standalone-macos.py build-app
      # Configure signing with the fork maintainer's own Apple credentials before
      # distributing a notarized macOS release.
      - name: Create unsigned DMG
        working-directory: standalone
        run: uv run python create-standalone-macos.py build-dmg
      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: mnelab-streams-macos-installer
          path: standalone/MNELAB-Streams-*.dmg

  standalone-windows:
    name: Build Windows standalone
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Install the project
        run: uv sync --locked --all-extras
      - uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install innosetup
      - name: Build standalone installer
        working-directory: standalone
        shell: pwsh
        run: |
          . ..\.venv\Scripts\Activate.ps1
          .\create-standalone-windows.ps1
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: mnelab-streams-windows-installer
          path: standalone/MNELAB-Streams-*.exe
